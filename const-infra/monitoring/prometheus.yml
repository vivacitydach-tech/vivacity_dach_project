# Target Enterprise — local Prometheus scrape config
# Used by docker-compose profile `monitoring`.
# Laptop substitute until in-cluster Prometheus exists.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape middleware health when running on the host (Windows / WSL / Linux).
  # From inside the compose network, host.docker.internal reaches the host.
  - job_name: const-middleware
    metrics_path: /v1/health
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: const-middleware
    # Health returns JSON, not Prometheus text — keep as reachability probe for now.
    # Replace with /metrics when Nest exposes a Prometheus endpoint.

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
