# Web UI — Next.js branded portal
apiVersion: apps/v1
kind: Deployment
metadata:
  name: const-web-ui
  namespace: prod-apps
  labels:
    app: const-web-ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: const-web-ui
  template:
    metadata:
      labels:
        app: const-web-ui
        tier: frontend
    spec:
      containers:
        - name: web-ui
          image: ghcr.io/target-enterprise/const-web-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_BASE_URL
              value: https://api.target.example/v1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: const-web-ui
  namespace: prod-apps
  labels:
    app: const-web-ui
spec:
  selector:
    app: const-web-ui
  ports:
    - name: http
      port: 80
      targetPort: http
