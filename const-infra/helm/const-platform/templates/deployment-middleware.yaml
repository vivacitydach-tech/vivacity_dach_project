apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "const-platform.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "const-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "const-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "const-platform.selectorLabels" . | nindent 8 }}
        tier: api
    spec:
      containers:
        - name: middleware
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "const-platform.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "const-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "const-platform.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
