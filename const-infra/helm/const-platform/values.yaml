# Default values for const-platform.
# Override per environment; pin image tags (never latest).

replicaCount: 2

image:
  repository: ghcr.io/target-enterprise/const-middleware
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  NODE_ENV: production
  UPSTREAM_MODE: http
  COST_CORE_BASE_URL: http://cost-core.prod-upstream.svc.cluster.local:8069
  PM_CORE_BASE_URL: http://pm-core.prod-upstream.svc.cluster.local:8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

namespace: prod-apps
